<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <h1>Student Management System</h1>
      <p class="subtitle">CRUD activity &middot; Django REST + JS</p>
    </div>
  </header>

  <main class="layout">

    <section class="panel form-panel">
      <h2 id="form-title">Add a student</h2>
      <form id="student-form">
        <input type="hidden" id="student-id">

        <label for="name">Full name</label>
        <input type="text" id="name" required placeholder="e.g. Priya Ramesh">

        <label for="roll_number">Roll number</label>
        <input type="text" id="roll_number" required placeholder="e.g. 22CS045">

        <label for="department">Department</label>
        <select id="department" required>
          <option value="">Select department</option>
          <option value="CSE">Computer Science Engineering</option>
          <option value="ECE">Electronics and Communication Engineering</option>
          <option value="EEE">Electrical and Electronics Engineering</option>
          <option value="MECH">Mechanical Engineering</option>
          <option value="CIVIL">Civil Engineering</option>
          <option value="IT">Information Technology</option>
        </select>

        <label for="year">Year</label>
        <select id="year" required>
          <option value="">Select year</option>
          <option value="1">1st year</option>
          <option value="2">2nd year</option>
          <option value="3">3rd year</option>
          <option value="4">4th year</option>
        </select>

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="e.g. priya@example.com">

        <div class="form-actions">
          <button type="submit" id="submit-btn">Add student</button>
          <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
        </div>

        <p id="form-message" class="message" hidden></p>
      </form>
    </section>

    <section class="panel table-panel">
      <div class="table-header">
        <h2>All students</h2>
        <input type="text" id="search-box" placeholder="Search by name, roll no, department...">
      </div>

      <table id="student-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Roll No.</th>
            <th>Department</th>
            <th>Year</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="student-tbody">
          <!-- rows injected by script.js -->
        </tbody>
      </table>

      <p id="empty-state" class="empty-state" hidden>No students yet. Add the first record on the left.</p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
